[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-token-consumption-tracker"
version = "1.1.3"
description = "Track per-request LLM token consumption and generate daily usage reports for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."hermes_agent.plugins"]
token-consumption-tracker = "hermes_token_consumption_tracker:register"

[project.urls]
Source = "https://github.com/nuffin/hermes-token-consumption-tracker-pip"

[tool.setuptools.packages.find]
include = ["hermes_token_consumption_tracker*"]
